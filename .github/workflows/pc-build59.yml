name: Publish reviewed PC Build59 assets
on:
  push:
    branches: [main]
    paths: [.github/workflows/pc-build59.yml]
permissions:
  contents: write
concurrency:
  group: pc-build59-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'tournamentcs16-hash/four-kingdoms-downloads'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TRANSFER_MANIFEST_URL: "https://reduced-views-floor-publications.trycloudflare.com/public-transfer/6cbd8f2f5f0b49199f231573fca2e892/TheTenthRiftTransferManifest.json"
      TRANSFER_MANIFEST_SHA256: "42fb2e21d71ece6d8dbacea581a06cc2b0f79a52b7f417247d8e7f75d4ca10ad"
      EXPECTED_FILES_JSON: "{\"TheTenthRiftBuild59.blocks01.bin\":{\"bytes\":1605256578,\"sha256\":\"9be7ceb149341355ce7823b1423b3eaa6e574fa3ab53b611360c1a4b334bc4f2\"},\"TheTenthRiftBuild59.blocks02.bin\":{\"bytes\":1608209117,\"sha256\":\"607403c9d6631fff555016b859c7db482e1eab85ad32ce372550125e47e80792\"},\"TheTenthRiftBuild59.blocks03.bin\":{\"bytes\":1605713534,\"sha256\":\"d8b400150f145ee736b8be9252d3d7b65d8fde4ffc4ef7895103cc7dd5583ea8\"},\"TheTenthRiftBuild59.blocks04.bin\":{\"bytes\":994364168,\"sha256\":\"ba7a8713e35b5832ade1b23a4b58c979ee45b1729d1f4312b7534585cf845f4f\"},\"TheTenthRiftBuild59.payload.json\":{\"bytes\":622438,\"sha256\":\"6b010629706792d6f456d8bcd9f59d669d9d4bb7f6243bbce4097ab77e63f15d\"},\"TheTenthRiftBuild59.receipt.json\":{\"bytes\":1042,\"sha256\":\"f2af430afbba9c0d461fd926f6b679c687ed5d8dae9313b6e5bb9a661dddc996\"},\"TheTenthRiftSetup.exe\":{\"bytes\":521216,\"sha256\":\"1ae56367c20828d4c85d6b9e904969fe08e564eae44c40a6756e589cc2e5bd96\"},\"TheTenthRiftLatest.json\":{\"bytes\":1914,\"sha256\":\"5d1cf0e69fbd0c60a61bbd7cf01598845640752530201597d86abfcb6063404e\"}}"
      PUBLIC_KEY_JSON_B64: ""
      FEED_SHA256: "5d1cf0e69fbd0c60a61bbd7cf01598845640752530201597d86abfcb6063404e"
      NATIVE_EXE_SHA256: "12ceb0f40f6aba8ed231e826b20db6ce3afbdfb76f0651c825bc17e31450e8b5"
    steps:
      - name: Verify signatures and publish exact public assets
        shell: bash
        run: |
          python3 - <<'PY'
          """One bounded public-PC release publication. No source, secrets or feed update."""
          import base64, concurrent.futures, hashlib, json, os, pathlib, re, subprocess, time, urllib.request
          
          REPO='tournamentcs16-hash/four-kingdoms-downloads'
          TAG='PC-Build59-alpha'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          manifest_url=os.environ['TRANSFER_MANIFEST_URL']
          assert re.fullmatch(r'https://[a-z0-9-]+\.trycloudflare\.com/public-transfer/[a-f0-9]{32}/TheTenthRiftTransferManifest.json',manifest_url)
          expected=json.loads(os.environ['EXPECTED_FILES_JSON'])
          key_bytes=base64.b64decode(os.environ['PUBLIC_KEY_JSON_B64'],validate=True)
          assert hashlib.sha256(key_bytes).hexdigest()=='63192ccf7576e5d6abb4473354220a2b822ddbe3d431772949c5d6aa705a3e90'
          key=json.loads(key_bytes)
          def digest(path):
              with path.open('rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
          def fetch(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TheTenthRift-public-release'}),timeout=60) as response: return response.read()
          raw=fetch(manifest_url)
          assert hashlib.sha256(raw).hexdigest()==os.environ['TRANSFER_MANIFEST_SHA256']
          manifest=json.loads(raw)
          assert manifest['schema']=='ttr.pc-reviewed-transfer.v1' and manifest['build']==59 and manifest['tag']==TAG
          rows={r['name']:r for r in manifest['files']}
          assert len(rows)==len(manifest['files']) and set(rows)==set(expected)
          folder=pathlib.Path('reviewed-pc59-assets');folder.mkdir(exist_ok=True)
          prefix=manifest_url.rsplit('/',1)[0]+'/'
          for name,row in rows.items():
              assert re.fullmatch(r'TheTenthRift[A-Za-z0-9_.-]+',name) and '..' not in name
              assert row['url']==prefix+name and {k:row[k] for k in ('bytes','sha256')}==expected[name]
              assert 0<row['bytes']<2*1024**3
          def download(name):
              row=rows[name];path=folder/name
              for attempt in range(6):
                  if path.exists() and path.stat().st_size==row['bytes']:
                      assert digest(path)==row['sha256'];return
                  offset=path.stat().st_size if path.exists() else 0
                  assert offset<row['bytes']
                  request=urllib.request.Request(row['url'],headers={'User-Agent':'TheTenthRift-public-release','Range':f'bytes={offset}-'})
                  try:
                      with urllib.request.urlopen(request,timeout=90) as response:
                          assert response.status==206 and response.headers['Content-Range'].startswith(f'bytes {offset}-')
                          with path.open('ab') as target:
                              while block:=response.read(4*1024*1024): target.write(block)
                      assert path.stat().st_size==row['bytes'] and digest(path)==row['sha256']
                      print('Verified public asset:',name,flush=True);return
                  except (OSError,TimeoutError) as error:
                      if attempt==5: raise
                      print('Resuming public download:',name,type(error).__name__,flush=True);time.sleep(2)
              raise RuntimeError('Download did not complete')
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool: list(pool.map(download,sorted(rows)))
          n=int.from_bytes(base64.b64decode(key['modulus_b64']), 'big');e=int.from_bytes(base64.b64decode(key['exponent_b64']), 'big')
          assert n.bit_length()==3072 and e==65537
          def signed(name):
              envelope=json.loads((folder/name).read_text())
              assert envelope['schema']=='ttr.pc-signed-envelope.v1' and envelope['key_id']==key['key_id'] and envelope['algorithm']=='RS256'
              payload=base64.b64decode(envelope['payload_b64'],validate=True);signature=base64.b64decode(envelope['signature_b64'],validate=True)
              assert len(signature)==384 and int.from_bytes(signature,'big')<n
              tail=bytes.fromhex('3031300d060960864801650304020105000420')+hashlib.sha256(payload).digest()
              block=b'\x00\x01'+b'\xff'*(384-len(tail)-3)+b'\x00'+tail
              assert pow(int.from_bytes(signature,'big'),e,n).to_bytes(384,'big')==block
              return json.loads(payload)
          feed=signed('TheTenthRiftLatest.json');payload=signed('TheTenthRiftBuild59.payload.json');receipt=signed('TheTenthRiftBuild59.receipt.json')
          assert all(d['revision']==59 and d['native_protocol']==1 for d in (feed,payload,receipt))
          assert feed['minimum_revision']==59 and feed['release_tag']==TAG and feed['version']=='0.1.8-alpha'
          assert receipt['native_exe_sha256']==os.environ['NATIVE_EXE_SHA256']
          assert digest(folder/'TheTenthRiftLatest.json')==os.environ['FEED_SHA256']
          public_base=f'https://github.com/{REPO}/releases/download/{TAG}/'
          for field in ('installer','payload','receipt'):
              row=feed[field];name=row['url'].removeprefix(public_base)
              assert row['url']==public_base+name and name in rows and {k:row[k] for k in ('bytes','sha256')}==expected[name]
          """Independent bounded verifier for signed content-defined PC payload recipes."""
          import hashlib,json,re,zlib
          from collections import OrderedDict
          from pathlib import Path
          from urllib.parse import urlsplit
          
          def verify_payload(payload,assets):
              assert payload['schema']=='ttr.pc-payload.v2' and payload['channel']=='pc-alpha'
              assert payload['chunker']=='ttr-gear64-v1-1m-4m-8m'
              files=payload['files'];blocks=payload['blocks'];parts=payload['parts']
              assert 0<len(files)<=4096 and 0<len(parts)<=32 and len(blocks)<=16000
              def number(value):
                  assert type(value) is int and 0<=value<=64*1024**3
                  return value
              def digest(data):return hashlib.sha256(data).hexdigest()
              def hex64(value):return isinstance(value,str) and re.fullmatch('[0-9a-f]{64}',value)
              paths=[]
              for part in parts:
                  name=urlsplit(part['url']).path.rsplit('/',1)[-1]
                  assert re.fullmatch(r'TheTenthRiftBuild\d+\.blocks\d\d\.bin',name)
                  assert part['url'].startswith(f"https://github.com/tournamentcs16-hash/four-kingdoms-downloads/releases/download/PC-Build{payload['revision']}-alpha/")
                  path=Path(assets)/name
                  assert path.is_file() and path.stat().st_size==number(part['bytes'])<2*1024**3 and hex64(part['sha256'])
                  with path.open('rb') as source:assert hashlib.file_digest(source,'sha256').hexdigest()==part['sha256']
                  paths.append(path)
              seen=set();computed={};metadata={};decoded=OrderedDict();total=0
              def raw_block(key):
                  assert hex64(key)
                  if key in decoded:
                      decoded.move_to_end(key);return decoded[key]
                  row=blocks[key];size=number(row['bytes']);stored_size=number(row['stored_bytes']);offset=number(row['offset']);part=number(row['part'])
                  assert 0<size<=8*1024**2 and 0<stored_size<=8*1024**2 and part<len(paths) and offset+stored_size<=parts[part]['bytes']
                  with paths[part].open('rb') as source:source.seek(offset);stored=source.read(stored_size)
                  assert len(stored)==stored_size and digest(stored)==row['stored_sha256']
                  if row['codec']=='raw':raw=stored
                  else:
                      assert row['codec']=='deflate';decoder=zlib.decompressobj(-15);raw=decoder.decompress(stored,size+1)
                      assert len(raw)<=size and decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
                  assert len(raw)==size and digest(raw)==key
                  decoded[key]=raw
                  if len(decoded)>4:decoded.popitem(last=False)
                  return raw
              for row in files:
                  path=row['path'];assert isinstance(path,str) and path and len(path)<=512 and '\\' not in path and ':' not in path and '..' not in path
                  segments=path.split('/');assert all(segments) and not set(s.lower() for s in segments)&{'private','saved','source','sourceassets','intermediate'}
                  assert segments[0] in ('Engine','TheTenthRift') or path in ('The Tenth Rift.exe','NOTICES.txt','START_HERE.txt')
                  assert path.lower() not in seen and hex64(row['sha256']);seen.add(path.lower());size=0;sha=hashlib.sha256();capture=[]
                  for key in row['blocks']:
                      raw=raw_block(key);size+=len(raw);sha.update(raw)
                      if path in ('TheTenthRift/ReleaseFiles.json','TheTenthRift/ReleaseReceipt.json'):
                          assert size<=2*1024**2;capture.append(raw)
                  assert size==number(row['bytes']) and sha.hexdigest()==row['sha256'];computed[path]=dict(bytes=size,sha256=sha.hexdigest());total+=size
                  if capture:metadata[path]=b''.join(capture)
              assert total<=64*1024**3 and set(metadata)=={'TheTenthRift/ReleaseFiles.json','TheTenthRift/ReleaseReceipt.json'}
              inventory=json.loads(metadata['TheTenthRift/ReleaseFiles.json']);listed={r['path']:{k:r[k] for k in ('bytes','sha256')} for r in inventory['files']}
              assert len(listed)==len(inventory['files']) and {k:v for k,v in computed.items() if k not in metadata}==listed
              return dict(files=len(files),blocks=len(blocks),installed_bytes=total,native_exe_sha256=computed['TheTenthRift/Binaries/Win64/TheTenthRift.exe']['sha256'],inventory_sha256=digest(metadata['TheTenthRift/ReleaseFiles.json']),receipt_bytes=metadata['TheTenthRift/ReleaseReceipt.json'])
          
          assert payload['schema']=='ttr.pc-payload.v2'
          for row in payload['parts']:
           name=row['url'].removeprefix(public_base)
           assert row['url']==public_base+name and {k:row[k] for k in ('bytes','sha256')}==expected[name]
          proof=verify_payload(payload,folder)
          assert proof['native_exe_sha256']==receipt['native_exe_sha256']==os.environ['NATIVE_EXE_SHA256']
          assert proof['inventory_sha256']==receipt['files_manifest_sha256']
          assert proof['receipt_bytes']==(folder/'TheTenthRiftBuild59.receipt.json').read_bytes()
          
          def gh(*args):
              result=subprocess.run(['gh',*args],text=True,capture_output=True)
              if result.returncode: print(result.stderr,flush=True);result.check_returncode()
              return result.stdout
          def find_release():
              # A cached pre-create list can omit the newly created own draft.
              endpoint=f'repos/{REPO}/releases?per_page=100&page=1&publication_poll={time.time_ns()}'
              matches=[r for r in json.loads(gh('api','-H','Cache-Control: no-cache',endpoint)) if r['tag_name']==TAG]
              assert len(matches)<=1
              return matches[0] if matches else None
          marker='<!-- TTR-PC59-REVIEWED:'+os.environ['TRANSFER_MANIFEST_SHA256']+' -->'
          notes='The Tenth Rift PC alpha — Build59 / 0.1.8-alpha\n\nAdds signed content-defined block updates: existing game data is reused and only missing compressed blocks are downloaded. First installation offers a game folder; updates retain that folder and temporary bulk data uses its drive. Adds an administrator-only pregame panel to grant/revoke solo test moderator access by public nickname. Test moderators keep ordinary player sign-in and can start a solo test without the queue; no administrator/staff powers are granted. The battlefield loading screen now covers accepted-match arena preparation and joining. Existing accounts, MFA, profiles, settings and Playit remain. No new heroes, gameplay balance changes, purchases or new backend.\n\n'+marker+'\n'
          pathlib.Path('pc59-release-notes.txt').write_text(notes)
          release=find_release()
          if release is not None:
              assert marker in (release.get('body') or ''), 'An independently managed release already exists; preserved'
          else:
              # Use the authenticated creation response's numeric ID, not a stale list.
              release=json.loads(gh('api',f'repos/{REPO}/releases','--method','POST','-f',f'tag_name={TAG}','-f','target_commitish=main','-f','name=The Tenth Rift PC alpha — Build59','-f',f'body={notes}','-F','draft=true','-F','prerelease=false','-f','make_latest=false'))
              assert release['tag_name']==TAG and release['draft'] and marker in release['body'] and isinstance(release['id'],int)
          endpoint=f'repos/{REPO}/releases/{release["id"]}'
          upload_names=set(rows)-{'TheTenthRiftLatest.json'}
          assert len(upload_names)==len(payload['parts'])+3
          existing={a['name']:a for a in release['assets']}
          assert set(existing)<=upload_names
          for name,asset in existing.items():
              assert asset['size']==expected[name]['bytes'] and asset.get('digest')=='sha256:'+expected[name]['sha256'], 'Existing asset differs; preserved'
          missing=sorted(upload_names-set(existing))
          if missing:
              assert release['draft'], 'Published release must already contain all exact assets'
              gh('release','upload',TAG,'--repo',REPO,*[str(folder/name) for name in missing])
          for attempt in range(15):
              release=json.loads(gh('api',endpoint));remote={a['name']:a for a in release['assets']}
              if set(remote)==upload_names and all(remote[name]['size']==expected[name]['bytes'] and remote[name].get('digest')=='sha256:'+expected[name]['sha256'] for name in upload_names): break
              time.sleep(2)
          else: raise RuntimeError('Remote release asset integrity is not confirmed; feed untouched')
          if release['draft']: gh('release','edit',TAG,'--repo',REPO,'--draft=false','--latest=false')
          release=json.loads(gh('api',endpoint));assert not release['draft']
          print(json.dumps({'status':'PUBLIC_PC59_ASSETS_PUBLISHED_FEED_UNCHANGED','release_id':release['id'],'tag':TAG,'assets':len(remote),'signed_feed_sha256':os.environ['FEED_SHA256'],'feed_promoted':False}),flush=True)
          PY
