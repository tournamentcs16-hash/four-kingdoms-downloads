name: Publish PC alpha binaries
on:
  push:
    branches: [codex/pc-alpha-20261115]
    paths:
      - .github/workflows/publish-pc-alpha.yml
      - pc-release/publish.json
permissions:
  contents: write
concurrency:
  group: pc-alpha-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and publish approved Windows client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -n "$0"
          repo=tournamentcs16-hash/four-kingdoms-downloads
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$GITHUB_REF" = refs/heads/codex/pc-alpha-20261115
          plan=pc-release/publish.json
          validation_filter='try (
            .schema == 1 and
            .repository == "tournamentcs16-hash/four-kingdoms-downloads" and
            (.release.tag | test("^PC-Build[0-9]{2,4}-alpha([.][0-9]{1,3})?$")) and
            (.release.title | type == "string" and length > 0 and length < 160) and
            (.release.notes | type == "string" and length > 0 and length < 12000) and
            .acceptance.multiplayer == true and
            .acceptance.self_registration == true and
            .acceptance.external_connection == true and
            .acceptance.public_payload_reviewed == true and
            .acceptance.mandatory_updates == true and
            .acceptance.installer == true and
            (.artifacts | type == "array" and length > 0 and length <= 24) and
            ([.artifacts[].name] | unique | length) == (.artifacts | length) and
            all(.artifacts[];
              (.name | test("^TheTenthRift[-A-Za-z0-9_.]*[.](exe|zip|7z|bin|json|txt|sha256)$")) and
              (.name | contains("..") | not) and
              (.url | test("^https://[a-z0-9-]+[.]trycloudflare[.]com/public-transfer/[A-Za-z0-9_./-]+$")) and
              (.url | test("/[.][.]?(/|$)") | not) and
              (.bytes | type == "number" and floor == . and . > 0 and . < 2147483648) and
              (.sha256 | test("^[a-f0-9]{64}$"))
            ) and
            ([.artifacts[].url | capture("^https://(?<h>[^/]+)/").h] | unique | length) == 1
          ) catch false'
          jq -n "$validation_filter" >/dev/null
          if [ ! -f "$plan" ]; then
            printf '%s\n' 'Publisher is ready. No approved multiplayer payload supplied; nothing published.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -e "$validation_filter" "$plan" >/dev/null
          tag=$(jq -r '.release.tag' "$plan")
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            printf '%s\n' 'Release tag already exists. Refusing to overwrite any release.' >&2
            exit 1
          fi
          output=$(mktemp -d)
          trap 'rm -rf -- "$output"' EXIT
          files=()
          while IFS=$'\t' read -r name url bytes sha; do
            path="$output/$name"
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 30 --max-time 1800 --retry 2 --max-filesize "$bytes" \
              --output "$path" "$url"
            test "$(stat -c %s "$path")" = "$bytes"
            printf '%s  %s\n' "$sha" "$path" | sha256sum --strict --check
            files+=("$path")
          done < <(jq -r '.artifacts[] | [.name,.url,(.bytes|tostring),.sha256] | @tsv' "$plan")
          before_latest=$(gh api "repos/$repo/releases/latest" --jq .id)
          plan_sha=$(sha256sum "$plan" | cut -d ' ' -f1)
          jq -r '.release.notes' "$plan" > "$output/notes.md"
          printf '\nPC publication plan SHA256: %s\n' "$plan_sha" >> "$output/notes.md"
          title=$(jq -r '.release.title' "$plan")
          gh release create "$tag" --repo "$repo" --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$output/notes.md" --draft --prerelease --latest=false
          gh release upload "$tag" "${files[@]}" --repo "$repo"
          gh api "repos/$repo/releases" --paginate > "$output/releases.json"
          release_id=$(jq -ser --arg tag "$tag" \
            '[.[][] | select(.tag_name == $tag and .draft == true)] | if length == 1 then .[0].id else error("Ambiguous draft") end' \
            "$output/releases.json")
          gh api "repos/$repo/releases/$release_id" > "$output/release.json"
          jq -e --slurpfile p "$plan" --arg sha "$GITHUB_SHA" '
            .draft == true and .prerelease == true and .target_commitish == $sha and
            (.assets | length) == ($p[0].artifacts | length) and
            ([.assets[].name] | unique | length) == (.assets | length) and
            all($p[0].artifacts[];
              . as $a | any($release.assets[];
                .name == $a.name and .size == $a.bytes and .digest == ("sha256:" + $a.sha256)
              )
            )
          ' --argjson release "$(cat "$output/release.json")" "$output/release.json" >/dev/null
          gh release edit "$tag" --repo "$repo" --draft=false --prerelease --latest=false
          after_latest=$(gh api "repos/$repo/releases/latest" --jq .id)
          test "$before_latest" = "$after_latest"
          url=$(gh release view "$tag" --repo "$repo" --json url --jq .url)
          printf 'Public PC alpha: %s\n\nExisting stable release preserved.\n' "$url" >> "$GITHUB_STEP_SUMMARY"
